# The size of the private vault. Must be a multiple of 9 (e.g., 9, 18, 27, 36, 45, 54).
private-vault-size: 54

# Home limits are based on permissions.
# The permission will be smptools.homes.<group>
home-limits:
  default: 1
  vip: 5
  admin: 10

features:
  accelerated-growth:
    enabled: true
    multiplier: 2.0 # Crops grow 2 times faster
  afk:
    enabled: true
    timeout-minutes: 30 # Auto-AFK after 30 minutes of inactivity
    auto-vote-sleep: true # Auto-vote YES on sleep votes when AFK
  remote-trade:
    enabled: true
    request-timeout-seconds: 60

# Storage configuration
# Supported storage types: FLATFILE, SQLITE, MYSQL, MARIADB, MONGODB
storage:
  type: "FLATFILE"
  sqlite:
    file: "smptools.db"
  mysql:
    host: "localhost"
    port: 3306
    database: "smptools"
    username: "root"
    password: ""
    pool-size: 10
    use-ssl: false
  mariadb:
    host: "localhost"
    port: 3306
    database: "smptools"
    username: "root"
    password: ""
    pool-size: 10
    use-ssl: false
  mongodb:
    uri: "mongodb://localhost:27017"
    database: "smptools"
    collection-prefix: "smptools_"