  countdown: "<gray>Teleporting in {seconds}...</gray>"
  successful: "<green>Teleport successful!</green>"
  cancelled: "<red>Teleport cancelled: {reason}</red>"
  already-teleporting: "<red>You are already teleporting.</red>"

